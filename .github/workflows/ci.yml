name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and pack (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == 24
        with:
          name: npm-package
          path: artifacts/**/*.tgz
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: DSH 0.1.5-rc.2 browser compatibility
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Test the packed plugin in real DSH
        run: |
          tarball="$(find "$PWD/artifacts" -type f -name '*.tgz')"
          test -f "$tarball"
          PLUGIN_TARBALL="$tarball" npm run test:browser

  publish:
    name: Publish npm and GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts
      - name: Publish verified bytes with trusted publishing
        run: |
          npm install --global npm@12.0.2 --ignore-scripts
          tarball="$(find "$PWD/artifacts" -type f -name '*.tgz')"
          test -f "$tarball"
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          existing="$(npm view "$name@$version" dist.integrity 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            actual="$(node --input-type=module -e 'import{createHash}from"node:crypto";import{readFileSync}from"node:fs";console.log("sha512-"+createHash("sha512").update(readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
            test "$existing" = "$actual"
            echo 'The identical package is already published.'
          else
            npm publish "$tarball" --access public --provenance
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="$(find "$PWD/artifacts" -type f -name '*.tgz')"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" "$tarball" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "docs/RELEASE-${GITHUB_REF_NAME#v}.md"
          fi
